name: Weekly Hermes Data Portfolio Publisher

on:
  schedule:
    # Chaque lundi à 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      week_override:
        description: 'Override ISO week number (e.g. 33)'
        required: false
        type: string
      dry_run:
        description: 'Generate locally but do not commit/push'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  publish-study:
    name: Generate + Publish Weekly Study
    runs-on: ubuntu-latest

    steps:
    - name: Checkout du projet
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Génération des 3 sujets (maroc, france, hybrid)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        WEEK_OVERRIDE: ${{ github.event.inputs.week_override || '' }}
      run: |
        python scripts/publish_study.py

    - name: Validate output files exist
      if: success()
      run: |
        for topic in maroc france hybrid; do
          LATEST=$(ls -td projects/${YEAR:-*}-W${WEEK_OVERRIDE:-*}-$topic 2>/dev/null | head -1)
          if [ -z "$LATEST" ]; then
            echo "::error::No project directory found for topic: $topic"
            exit 1
          fi
          echo "✅ $topic: $LATEST"
          if [ ! -f "$LATEST/index.html" ]; then
            echo "::error::Missing index.html in $LATEST"
            exit 1
          fi
          echo "   ✅ index.html present ($(wc -c < "$LATEST/index.html") bytes)"
          if [ ! -f "$LATEST/README.md" ]; then
            echo "::warning::Missing README.md in $LATEST (non-fatal)"
          fi
        done

    - name: Validate Pages deploy workflow
      run: |
        if [ ! -f .github/workflows/pages.yml ]; then
          echo "::error::pages.yml workflow missing"
          exit 1
        fi
        echo "✅ pages.yml present"