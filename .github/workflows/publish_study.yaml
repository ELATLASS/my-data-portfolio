name: Weekly Hermes Data Portfolio Publisher

on:
  schedule:
    # S'exécute chaque lundi à 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch: # Permet d'exécuter le script manuellement depuis GitHub si besoin

jobs:
  publish-study:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout du projet
      uses: actions/checkout@v4

    - name: Installation de Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Installer les dépendances & Hermes Agent
      run: |
        python -m pip install --upgrade pip
        pip install pandas seaborn matplotlib hermes-agent

    - name: Génération et Publication automatique
      env:
        # Remplace par ta variable de clé API dans GitHub Secrets (Settings > Secrets and variables > Actions)
        OPENAI_API_KEY: ${{ secrets.HERMES_LLM_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python scripts/publish_study.py