name: Weekly Hermes Data Portfolio Publisher

on:
  schedule:
    # Chaque lundi à 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      week_override:
        description: 'Override ISO week number (e.g. 33)'
        required: false
        type: string
      dry_run:
        description: 'Generate locally but do not commit/push'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  publish-study:
    name: Generate + Publish Weekly Study
    runs-on: ubuntu-latest

    steps:
    - name: Checkout du projet
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Génération des 3 sujets (maroc, france, hybrid)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        WEEK_OVERRIDE: ${{ github.event.inputs.week_override || '' }}
      run: |
        python scripts/publish_study.py

    - name: Validate output files exist
      if: success()
      run: |
        for topic in maroc france hybrid; do
          LATEST=$(ls -td studies/$topic/2026-W* 2>/dev/null | head -1)
          if [ -z "$LATEST" ]; then
            echo "::error::No study directory found for topic: $topic"
            exit 1
          fi
          echo "✅ $topic: $LATEST"
          if [ ! -f "$LATEST/index.html" ]; then
            echo "::error::Missing index.html in $LATEST"
            exit 1
          fi
          echo "   ✅ index.html present ($(wc -c < "$LATEST/index.html") bytes)"
          if [ ! -f "$LATEST/README.md" ]; then
            echo "::warning::Missing README.md in $LATEST (non-fatal)"
          fi
          if ! grep -q "chart.js" "$LATEST/index.html"; then
            echo "::error::Missing Chart.js in $LATEST/index.html"
            exit 1
          fi
          echo "   ✅ Chart.js present"
          if ! grep -q "kpi-row" "$LATEST/index.html"; then
            echo "::error::Missing KPI cards in $LATEST/index.html"
            exit 1
          fi
          echo "   ✅ KPI cards present"
          if ! grep -q "<table" "$LATEST/index.html"; then
            echo "::error::Missing data table in $LATEST/index.html"
            exit 1
          fi
          echo "   ✅ Data table present"
        done

    - name: Validate dashboards exist
      if: success()
      run: |
        for d in w28 w29 w30 w31 w32; do
          if [ ! -f "dashboards/$d/index.html" ]; then
            echo "::warning::Missing dashboard: dashboards/$d/index.html"
          else
            echo "✅ dashboards/$d/index.html ($(wc -c < "dashboards/$d/index.html") bytes)"
          fi
        done

    - name: Validate Pages deploy workflow
      run: |
        if [ ! -f .github/workflows/pages.yml ]; then
          echo "::error::pages.yml workflow missing"
          exit 1
        fi
        echo "✅ pages.yml present"

    - name: Commit and push generated files
      if: success() && github.event.inputs.dry_run != 'true'
      run: |
        git config user.name "Hermes Agent"
        git config user.email "elatlassiabdessamad@outlook.fr"
        git add -A
        git diff --cached --quiet && echo "No changes to commit" && exit 0
        git commit -m "chore: weekly study publish $(date +%Y-%m-%d)"
        git push origin main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Pages artifact
      if: success()
      uses: actions/upload-pages-artifact@v3
      with:
        path: .
        retention-days: 1

    - name: Notify on failure
      if: failure()
      run: |
        echo "::error::Weekly study publish failed!"
        exit 1